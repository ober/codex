[package]
name = "codex-keyring-store"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
keyring = { workspace = true, features = ["crypto-rust"] }
tracing = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
secret-service = "4"
keyring = { workspace = true, features = ["linux-native-async-persistent"] }

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"
keyring = { workspace = true, features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { workspace = true, features = ["windows-native"] }

# FreeBSD and OpenBSD do not have a guaranteed Secret Service/DBus provider.
# Keep the portable keyring API available; callers receive the platform error
# when secure storage is unavailable instead of making the CLI require DBus at
# link time.

[dev-dependencies]
pretty_assertions = { workspace = true }

[lib]
doctest = false
